// build.gradle
plugins {
    id 'java'
    id 'eclipse'
}

def ghidraInstallDir = project.hasProperty('ghidraInstallDir') ? project.ghidraInstallDir : "/Applications/ghidra_11.3.1_PUBLIC"

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: ghidraInstallDir + '/Ghidra/Framework', include: ['**/*.jar'])
    implementation fileTree(dir: ghidraInstallDir + '/Ghidra/Features', include: ['**/*.jar'])
}

// FORCE Java 17 compatibility so Ghidra can actually load it
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Derive the target Ghidra version from extension.properties so the build artifact
// name matches the documented convention: dist/ghidra-mcp-<ghidra_version>.zip.
// (Compatibility itself is governed by extension.properties inside the ZIP, not the
// filename — keeping the two in sync avoids the prebuilt-vs-built naming mismatch.)
def extProps = new Properties()
file("extension.properties").withInputStream { extProps.load(it) }
def ghidraVersion = extProps.getProperty("ghidra_version", "unknown")

task zipExtension(type: Zip) {
    archiveFileName = "ghidra-mcp-${ghidraVersion}.zip"
    destinationDirectory = file("dist")

    from (projectDir) {
        include 'extension.properties'
        include 'Module.manifest'
        into 'ghidra-mcp'
    }
    
    from (jar) {
        into 'ghidra-mcp/lib'
    }
}

build.dependsOn zipExtension
