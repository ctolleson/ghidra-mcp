// build.gradle — Ghidra MCP extension
//
// Requires Ghidra 12.0.1 and JDK 21+.
//
// Point the build at your Ghidra installation either by exporting
// GHIDRA_INSTALL_DIR, or by passing -PghidraInstallDir=/path/to/ghidra:
//
//   export GHIDRA_INSTALL_DIR=/opt/ghidra_12.0.1_PUBLIC
//   gradle build
//
plugins {
    id 'java'
    id 'eclipse'
}

def ghidraInstallDir = findProperty('ghidraInstallDir') ?: System.getenv('GHIDRA_INSTALL_DIR')

if (!ghidraInstallDir) {
    throw new GradleException(
        "Ghidra installation not found.\n" +
        "Set GHIDRA_INSTALL_DIR or pass -PghidraInstallDir=/path/to/ghidra_12.0.1_PUBLIC")
}
if (!file("${ghidraInstallDir}/Ghidra/application.properties").exists()) {
    throw new GradleException("Not a Ghidra installation: ${ghidraInstallDir}")
}

// Ghidra's ExtensionInstaller compares extension.properties `version=` as an
// exact string against the Ghidra version at install time. Rather than hardcode
// it (which breaks whenever you build for a different Ghidra), read the version
// straight from the target install and stamp it into the packaged extension.
def ghidraVersion = {
    def props = new Properties()
    file("${ghidraInstallDir}/Ghidra/application.properties").withInputStream { props.load(it) }
    def v = props.getProperty('application.version')
    if (!v?.trim()) {
        throw new GradleException("application.version not found in ${ghidraInstallDir}/Ghidra/application.properties")
    }
    return v.trim()
}()

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: ghidraInstallDir + '/Ghidra/Framework', include: ['**/*.jar'])
    implementation fileTree(dir: ghidraInstallDir + '/Ghidra/Features', include: ['**/*.jar'])
}

// Ghidra 12.x requires JDK 21 (application.java.min=21).
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    archiveBaseName = 'ghidra-mcp'
}

// Generate extension.properties with the version stamped from the target Ghidra
// install. The committed extension.properties `version=` value is a placeholder;
// this is the value that actually ships in the zip.
def generatedExtProps = layout.buildDirectory.file("generated/extension.properties")

task genExtensionProps {
    def srcFile = file('extension.properties')
    def outFile = generatedExtProps.get().asFile
    inputs.file(srcFile)
    inputs.property('ghidraVersion', ghidraVersion)
    outputs.file(outFile)
    doLast {
        outFile.parentFile.mkdirs()
        def lines = srcFile.readLines().collect { line ->
            line.startsWith('version=') ? "version=${ghidraVersion}" : line
        }
        outFile.text = lines.join('\n') + '\n'
        logger.lifecycle("Stamped ghidra-mcp extension version=${ghidraVersion} (from ${ghidraInstallDir})")
    }
}

task zipExtension(type: Zip) {
    dependsOn genExtensionProps
    archiveFileName = "ghidra-mcp.zip"
    destinationDirectory = file("dist")

    from (generatedExtProps) {
        into 'ghidra-mcp'
    }
    from (projectDir) {
        include 'Module.manifest'
        into 'ghidra-mcp'
    }

    from (jar) {
        into 'ghidra-mcp/lib'
    }
}

build.dependsOn zipExtension
